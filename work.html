<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work · Housing Hues</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
.msg{color:var(--dim);margin:0}
.card .shot{width:100%;height:auto;border-radius:4px;margin-bottom:10px;display:block}
.card a.go{display:inline-block;margin-top:8px;color:var(--gold)}

.paths{display:flex;gap:8px;width:100%;max-width:760px}
.paths button{flex:1;font:inherit;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;min-height:48px;cursor:pointer}
.paths button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
form{display:grid;gap:12px;margin-top:12px}
label{display:grid;gap:6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
input,textarea{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:4px;padding:12px;width:100%;min-height:46px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.send{font:inherit;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:#000;background:var(--gold);border:0;border-radius:4px;padding:14px;min-height:48px;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ok,.err{margin:12px 0 0}.card p.ok{color:#b6ff3d}.card p.err{color:#ff8a7a}
.sg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.sg label{display:block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.sg .r{display:flex;gap:8px;margin-top:8px}.sg input{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px;padding:9px 10px}.sg button{font:inherit;color:#000;background:var(--gold);border:0;border-radius:4px;padding:9px 14px;cursor:pointer}.sg small{display:block;margin-top:6px;color:var(--dim)}.sg .hp{position:absolute;left:-9999px}
</style>
<script defer src="/_vercel/insights/script.js"></script></head><body>
<div class="top"><a href="index.html">← Housing Hues</a><h1>Work</h1><p class="sub">// What we're busy with</p></div>
<main id="list" aria-live="polite"><p class="msg">Loading…</p></main>
<section id="join" style="margin-top:28px;width:100%"><h2 style="font-family:inherit;margin:0 0 4px">Get in on it</h2><p class="msg" style="margin:0 0 12px">Seen what we're building? Creators and backers, sign up here.</p>
<div class="paths" id="paths" role="group" aria-label="Pick a path">
  <button type="button" data-p="creator" aria-pressed="true">Creator</button>
  <button type="button" data-p="backer" aria-pressed="false">Backer</button>
</div>
<article class="card">
  <h2 id="ttl">Creators</h2>
  <p id="sub" style="color:var(--fg)">Show us what you make.</p>
  <form id="f" novalidate>
    <label>Name<input name="name" maxlength="80" autocomplete="name" required></label>
    <label>Phone, WhatsApp or email<input name="contact" maxlength="120" autocomplete="off" required></label>
    <label><span id="fl">Your craft</span><input name="focus" maxlength="120"></label>
    <label><span id="ll">Link to your work (optional)</span><input name="link" type="url" inputmode="url" maxlength="300" placeholder="https://"></label>
    <label>Message (optional)<textarea name="message" maxlength="600"></textarea></label>
    <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="send" id="send" type="submit">Send</button>
    <p class="ok" id="ok" hidden>Received. We'll be in touch.</p>
    <p class="err" id="er" hidden>Couldn’t send that. Check your details and try again.</p>
  </form>
</article></section>
<script>
(function(){
var URL_='https://hxcskyrsgvojixtjtjlx.supabase.co/rest/v1/work?select=*&published=eq.true&order=sort_order.asc';
var KEY='sb_publishable_uy9UK3ULBgv5Ebhx29_YLw_nQh7PuH3';
var list=document.getElementById('list');
function safe(u){return typeof u==='string'&&(/^https?:\/\//i.test(u)||/^img\/[\w.\-]+$/.test(u))?u:null}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function suggest(a){
  var w=el('div','sg'),done=false;try{done=localStorage.getItem('hh_artist')==='1'}catch(e){}
  w.appendChild(el('label',0,'Who should we book next?'));
  if(done){w.appendChild(el('small',0,'Got your suggestion. Thanks.'));a.appendChild(w);return}
  var f=el('form','r'),i=el('input');i.maxLength=80;i.placeholder='Artist name';i.setAttribute('aria-label','Artist name');i.required=true;
  var h=el('input','hp');h.tabIndex=-1;h.autocomplete='off';h.setAttribute('aria-hidden','true');
  var b=el('button',0,'Send');b.type='submit';f.appendChild(i);f.appendChild(h);f.appendChild(b);w.appendChild(f);
  var n=el('small',0,'We read every one. No promises.');w.appendChild(n);
  f.addEventListener('submit',function(e){e.preventDefault();var v=i.value.trim();if(v.length<2||h.value)return;b.disabled=true;
    fetch('https://hxcskyrsgvojixtjtjlx.supabase.co/rest/v1/artist_requests',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({artist:v})})
    .then(function(r){if(!r.ok)throw 0;try{localStorage.setItem('hh_artist','1')}catch(e){}f.remove();n.textContent='Got it. Thanks.'})
    .catch(function(){b.disabled=false;n.textContent='Didn’t go through. Try again.'})});
  a.appendChild(w)}
function render(items){
  list.textContent='';
  if(!items.length){list.appendChild(el('p','msg','Nothing here yet.'));return}
  items.forEach(function(i){
    var a=el('article','card'),img=safe(i.image_url);
    if(img){var im=el('img','shot');im.src=img;im.alt=i.title;im.loading='lazy';a.appendChild(im)}
    a.appendChild(el('h2',0,i.title));
    if(i.label)a.appendChild(el('span','role',i.label));
    if(i.description)a.appendChild(el('p',0,i.description));
    var ls=Array.isArray(i.links)?i.links:[];
    if(ls.length){var w=el('div','links');ls.forEach(function(l){var u=safe(l.url);if(u&&/^https?:/i.test(u)){var g=el('a',0,(l.label||'Link')+' ↗');g.href=u;g.target='_blank';g.rel='noopener';w.appendChild(g)}});a.appendChild(w)}
    if(/^Klerksdorp Summer Blow/.test(i.title))suggest(a);
    list.appendChild(a)});
}
fetch(URL_,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}).then(function(r){if(!r.ok)throw 0;return r.json()})
.then(render)
.catch(function(){list.textContent='';list.appendChild(el('p','msg','Couldn’t load the work right now. Please try again shortly.'))});
})();
</script>
<script>
(function(){
var API='https://hxcskyrsgvojixtjtjlx.supabase.co/rest/v1/contributions',K='sb_publishable_uy9UK3ULBgv5Ebhx29_YLw_nQh7PuH3';
var path='creator',f=document.getElementById('f'),btn=document.getElementById('send'),ok=document.getElementById('ok'),er=document.getElementById('er');
var T={creator:['Creators','Show us what you make.','Your craft','Link to your work (optional)'],backer:['Backers','Tell us what you want to be part of.','What interests you','Link, e.g. your company or profile (optional)']};
document.getElementById('paths').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;path=b.dataset.p;
  [].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b)});
  var t=T[path];document.getElementById('ttl').textContent=t[0];document.getElementById('sub').textContent=t[1];document.getElementById('fl').textContent=t[2];document.getElementById('ll').textContent=t[3];ok.hidden=er.hidden=true;
});
f.addEventListener('submit',function(e){
  e.preventDefault();ok.hidden=er.hidden=true;
  var d=new FormData(f);if(d.get('website'))return;
  var name=(d.get('name')||'').trim(),contact=(d.get('contact')||'').trim(),link=(d.get('link')||'').trim();
  if(!name||contact.length<3||(link&&!/^https?:\/\//i.test(link))){er.hidden=false;return}
  btn.disabled=true;
  fetch(API,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({path:path,name:name,contact:contact,focus:(d.get('focus')||'').trim()||null,link:link||null,message:(d.get('message')||'').trim()||null})})
  .then(function(r){if(!r.ok)throw 0;f.reset();ok.hidden=false})
  .catch(function(){er.hidden=false}).then(function(){btn.disabled=false});
});
})();
</script>
</body></html>
