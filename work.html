<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work · Housing Hues</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
.msg{color:var(--dim);margin:0}
.card .shot{width:100%;height:auto;border-radius:4px;margin-bottom:10px;display:block}
.card a.go{display:inline-block;margin-top:8px;color:var(--gold)}
</style>
<script defer src="/_vercel/insights/script.js"></script></head><body>
<div class="top"><a href="index.html">← Housing Hues</a><h1>Work</h1><p class="sub">// What we're busy with</p></div>
<main id="list" aria-live="polite"><p class="msg">Loading…</p></main>
<script>
(function(){
var URL_='https://hxcskyrsgvojixtjtjlx.supabase.co/rest/v1/work?select=*&published=eq.true&order=sort_order.asc';
var KEY='sb_publishable_uy9UK3ULBgv5Ebhx29_YLw_nQh7PuH3';
var list=document.getElementById('list');
function safe(u){return typeof u==='string'&&(/^https?:\/\//i.test(u)||/^img\/[\w.\-]+$/.test(u))?u:null}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function render(items){
  list.textContent='';
  if(!items.length){list.appendChild(el('p','msg','Nothing here yet.'));return}
  items.forEach(function(i){
    var a=el('article','card'),img=safe(i.image_url);
    if(img){var im=el('img','shot');im.src=img;im.alt=i.title;im.loading='lazy';a.appendChild(im)}
    a.appendChild(el('h2',0,i.title));
    if(i.label)a.appendChild(el('span','role',i.label));
    if(i.description)a.appendChild(el('p',0,i.description));
    var ls=Array.isArray(i.links)?i.links:[];
    if(ls.length){var w=el('div','links');ls.forEach(function(l){var u=safe(l.url);if(u&&/^https?:/i.test(u)){var g=el('a',0,(l.label||'Link')+' ↗');g.href=u;g.target='_blank';g.rel='noopener';w.appendChild(g)}});a.appendChild(w)}
    list.appendChild(a)});
}
fetch(URL_,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}).then(function(r){if(!r.ok)throw 0;return r.json()})
.then(render)
.catch(function(){list.textContent='';list.appendChild(el('p','msg','Couldn’t load the work right now. Please try again shortly.'))});
})();
</script>
</body></html>
